apiVersion: apps/v1
kind: Deployment
metadata:
  name: securebank-api-green
  namespace: securebank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: securebank-api
      version: green
  template:
    metadata:
      labels:
        app: securebank-api
        version: green
    spec:
      containers:
      - name: api
        image: rajkumarvangeti/securebank-api:9bc2cf0208529325b6e378053ba84a652f2ca4a0
        ports:
        - containerPort: 8080

