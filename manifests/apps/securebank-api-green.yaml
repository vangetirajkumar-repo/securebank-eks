apiVersion: apps/v1
kind: Deployment
metadata:
  name: securebank-api-green
  namespace: securebank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: securebank-api
      version: green
  template:
    metadata:
      labels:
        app: securebank-api
        version: green
    spec:
      containers:
      - name: api
        image: rajkumarvangeti/securebank-api:2f0f75b24add3255b5335bb83f9b60a91ab220fb
        ports:
        - containerPort: 8080

