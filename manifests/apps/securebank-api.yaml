apiVersion: apps/v1
kind: Deployment
metadata:
  name: securebank-api
  namespace: securebank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: securebank-api
  template:
    metadata:
      labels:
        app: securebank-api
    spec:
      containers:
      - name: api
        image: rajkumarvangeti/securebank-api:7d97fc521124a41129f0b6ba93284eb4749af0d9
        ports:
        - containerPort: 8080

